<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Forensics AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --success: #10B981;
            --success-bg: #ECFDF5;
            --danger: #EF4444;
            --danger-bg: #FEF2F2;
            --warning: #F59E0B;
            --warning-bg: #FFFBEB;
            --bg-gradient: linear-gradient(135deg, #F3F4F6 0%, #E5E7EB 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-gradient);
            color: var(--text-main); 
            min-height: 100vh; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
        }

        .container { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1), 0 0 20px rgba(99, 102, 241, 0.05); 
            width: 100%; 
            max-width: 1050px; 
            border: 1px solid rgba(255,255,255,0.5);
        }

        /* Header */
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { 
            margin: 0; 
            font-size: 36px; 
            font-weight: 800; 
            background: linear-gradient(to right, #4F46E5, #9333EA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .header p { color: var(--text-muted); font-size: 16px; margin-top: 10px; }

        /* Upload Area */
        .upload-area { 
            border: 2px dashed #CBD5E1; 
            border-radius: 16px; 
            padding: 40px 20px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-bottom: 25px; 
            background: #F8FAFC;
            position: relative;
            overflow: hidden;
        }
        .upload-area:hover { 
            border-color: var(--primary); 
            background: #EEF2FF; 
            transform: translateY(-2px);
        }
        .upload-area.dragover { border-color: var(--primary); background: #EEF2FF; }
        
        input[type="file"] { display: none; }
        
        .upload-label { 
            display: inline-flex; 
            align-items: center;
            gap: 8px;
            background: var(--primary); 
            color: white; 
            padding: 12px 24px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.3);
        }
        .upload-label:hover { background: var(--primary-hover); transform: translateY(-1px); }
        
        .file-name { margin-top: 15px; font-size: 14px; color: var(--text-muted); font-weight: 500; }

        /* Analyze Button */
        .btn-analyze { 
            width: 100%; 
            padding: 16px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .btn-analyze:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4); }
        .btn-analyze:disabled { background: #94A3B8; cursor: not-allowed; box-shadow: none; transform: none; }

        /* Results Section */
        .results-section { margin-top: 40px; display: none; animation: fadeIn 0.5s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .summary-bar { 
            background: linear-gradient(to right, #EEF2FF, #E0E7FF); 
            padding: 16px 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            font-weight: 600; 
            color: var(--primary-hover); 
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #C7D2FE;
        }

        /* Table Design */
        .table-responsive { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
        .master-table { width: 100%; border-collapse: collapse; background: white; min-width: 800px; }
        .master-table th { background: #F8FAFC; padding: 16px; text-align: left; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 700; border-bottom: 2px solid var(--border); }
        .master-table td { padding: 16px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
        .master-table tr:last-child td { border-bottom: none; }
        .master-table tr { transition: background 0.2s; }
        
        /* Row Colors */
        .row-danger { background-color: var(--danger-bg); }
        .row-warning { background-color: var(--warning-bg); }
        .row-success { background-color: var(--success-bg); }
        .master-table tr:hover { filter: brightness(0.98); }

        /* Badges */
        .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 12px; text-align: center; letter-spacing: 0.5px;}
        .badge-danger { background: #FEE2E2; color: #B91C1C; border: 1px solid #FCA5A5; }
        .badge-warning { background: #FEF3C7; color: #B45309; border: 1px solid #FCD34D; }
        .badge-success { background: #D1FAE5; color: #047857; border: 1px solid #6EE7B7; }

        /* Thumbnails */
        .thumb-container { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .thumb { width: 70px; height: 70px; border-radius: 10px; object-fit: cover; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .file-name-label { font-size: 12px; font-weight: 500; color: var(--text-muted); max-width: 90px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; text-align: center; }

        /* Details Data */
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
        .detail-item { display: flex; gap: 5px; color: var(--text-muted); }
        .detail-item strong { color: var(--text-main); }
        .flag-list { grid-column: span 2; margin: 5px 0 0 0; padding-left: 15px; font-size: 12px; color: #B91C1C; }

        /* Loader */
        .loader { display: none; text-align: center; margin: 30px 0; }
        .spinner { width: 40px; height: 40px; border: 4px solid #E0E7FF; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { color: var(--primary); font-weight: 600; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🛡️ Image Forensics</h1>
        <p>Upload images to detect AI generation or manual editing.</p>
    </div>

    <!-- Drag and Drop / Upload Area -->
    <div class="upload-area" id="dropZone" onclick="document.getElementById('imageInput').click()">
        <label class="upload-label">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
            Choose Images
        </label>
        <input type="file" id="imageInput" accept="image/*" multiple onchange="handleFileSelect(event)">
        <div class="file-name" id="fileName">No files selected</div>
    </div>

    <button id="analyzeBtn" class="btn-analyze" onclick="analyzeImages()">Analyze Images</button>
    
    <!-- Loader -->
    <div id="loader" class="loader">
        <div class="spinner"></div>
        <div class="loader-text">Analyzing image(s)... This may take a moment.</div>
    </div>

    <!-- Results Section -->
    <div id="resultsSection" class="results-section">
        <div id="summaryBar" class="summary-bar"></div>
        
        <div class="table-responsive">
            <table class="master-table">
                <thead>
                    <tr>
                        <th width="120">Preview</th>
                        <th width="150">Verdict</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows injected here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let selectedFiles = [];
    let base64Images = [];

    // Drag & Drop visual feedback
    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if(e.dataTransfer.files.length) {
            document.getElementById('imageInput').files = e.dataTransfer.files;
            handleFileSelect({ target: { files: e.dataTransfer.files } });
        }
    });

    function handleFileSelect(event) {
        selectedFiles = Array.from(event.target.files);
        base64Images = [];
        document.getElementById('fileName').innerText = `${selectedFiles.length} file(s) selected`;
        document.getElementById('resultsSection').style.display = 'none';

        if (selectedFiles.length === 0) return;

        selectedFiles.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                base64Images[index] = e.target.result; 
            };
            reader.readAsDataURL(file);
        });
    }

    async function analyzeImages() {
        if (base64Images.length === 0) {
            alert("Please select at least one image!");
            return;
        }

        const btn = document.getElementById('analyzeBtn');
        const loader = document.getElementById('loader');
        const resultsSection = document.getElementById('resultsSection');

        btn.disabled = true;
        btn.innerText = 'Processing...';
        loader.style.display = 'block';
        resultsSection.style.display = 'none';

        try {
            const response = await fetch('/validate-images', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ imgpaths: base64Images })
            });

            const data = await response.json();
            
            if (!response.ok) throw new Error(data.detail || "Server error");

            renderBatchResults(data);

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = 'Analyze Images';
            loader.style.display = 'none';
        }
    }

    function renderBatchResults(data) {
        const resultsSection = document.getElementById('resultsSection');
        const summaryBar = document.getElementById('summaryBar');
        const tableBody = document.getElementById('tableBody');

        resultsSection.style.display = 'block';
        
        // Count results
        const aiCount = data.results.filter(r => r.is_ai_generated).length;
        const editCount = data.results.filter(r => r.is_edited && !r.is_ai_generated).length;
        
        summaryBar.innerHTML = `
            <span>Processed ${data.processed} / ${data.total_images} images</span>
            <span style="font-size: 13px;">
                <span style="color:var(--danger)">${aiCount} AI</span> &bull; 
                <span style="color:var(--warning)">${editCount} Edited</span>
            </span>
        `;
        
        tableBody.innerHTML = '';

        data.results.forEach((result, index) => {
            const originalFileName = selectedFiles[index] ? selectedFiles[index].name : 'Unknown';
            
            // Truncate filename if too long
            const displayName = originalFileName.length > 15 ? originalFileName.substring(0, 12) + '...' : originalFileName;

            const tr = document.createElement('tr');
            
            let rowClass = 'row-success';
            let badgeClass = 'badge-success';
            let verdictText = 'ORIGINAL';

            if (result.is_ai_generated && result.is_edited) {
                rowClass = 'row-danger'; badgeClass = 'badge-danger'; verdictText = 'FORGED & AI';
            } else if (result.is_ai_generated) {
                rowClass = 'row-danger'; badgeClass = 'badge-danger'; verdictText = 'AI GENERATED';
            } else if (result.is_edited) {
                rowClass = 'row-warning'; badgeClass = 'badge-warning'; verdictText = 'EDITED';
            }

            if (!result.success) {
                rowClass = 'row-warning'; badgeClass = 'badge-warning'; verdictText = 'ERROR';
            }

            tr.className = rowClass;

            let detailsHtml = `
                <div class="details-grid">
                    <div class="detail-item"><strong>Format:</strong> ${result.format || 'N/A'}</div>
                    <div class="detail-item"><strong>Dimensions:</strong> ${result.dimensions || 'N/A'}</div>
            `;
            
            if (result.success) {
                if (result.ai_detection && result.ai_detection.success) {
                    const score = (result.ai_detection.ai_score * 100).toFixed(1);
                    const color = result.ai_detection.ai_score >= 0.4 ? 'var(--danger)' : 'var(--success)';
                    detailsHtml += `<div class="detail-item" style="grid-column: span 2;"><strong>AI Confidence:</strong> <span style="color:${color}; font-weight:bold;">${score}%</span></div>`;
                }
                
                if (result.forensics && result.forensics.flags.length > 0) {
                    detailsHtml += `<div style="grid-column: span 2; margin-top:5px;"><strong>Flags:</strong><ul class="flag-list">`;
                    result.forensics.flags.forEach(flag => { detailsHtml += `<li>${flag}</li>`; });
                    detailsHtml += `</ul></div>`;
                }
            } else {
                detailsHtml += `<div class="detail-item" style="grid-column: span 2; color:red; font-weight:bold;">${result.error}</div>`;
            }
            detailsHtml += `</div>`;

            tr.innerHTML = `
                <td>
                    <div class="thumb-container">
                        <img src="${base64Images[index]}" class="thumb" alt="Thumb">
                        <div class="file-name-label" title="${originalFileName}">${displayName}</div>
                    </div>
                </td>
                <td>
                    <span class="badge ${badgeClass}">${verdictText}</span>
                </td>
                <td>${detailsHtml}</td>
            `;

            tableBody.appendChild(tr);
        });
    }
</script>

</body>
</html>
