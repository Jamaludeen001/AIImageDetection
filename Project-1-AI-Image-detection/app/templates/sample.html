<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit Punching Request</title>
<style>
:root{color-scheme:light;--blue:#5b6fe0;--ink:#2c3340;--lab:#5a6472;--mute:#8a94a3;--line:#dde2e8;--red:#e03e3e;--ok:#1f6b2f;--ok-bg:#e4f3e6;--warn:#7a4a06;--warn-bg:#fbefd5;--bad:#8c2222;--bad-bg:#fbe6e6;--inv:#856404;--inv-bg:#fff3cd;--inv-border:#ffeeba}
*{box-sizing:border-box}
body{margin:0;background:#f4f6fb;color:var(--ink);font:15px/1.5 "Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.page{max-width:1120px;margin:0 auto;padding:24px 16px 48px}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 8px rgba(40,50,90,.1);padding:20px 26px 26px;margin-bottom:18px}
.head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:14px}
h1{display:flex;align-items:center;gap:8px;margin:0;font-size:20px;font-weight:600;color:#6577e6}
h1 svg{width:19px;height:19px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#6f49b8;color:#fff;border:0;border-radius:99px;padding:5px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.pill svg{width:13px;height:13px}
.note{background:#eef1fc;border-left:4px solid var(--blue);padding:10px 14px;margin:0 0 14px;font-size:14px;color:var(--lab)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
@media (max-width:760px){.g2{grid-template-columns:1fr}.card{padding:16px}}
[hidden]{display:none!important}
.fld{margin-bottom:12px}
label{display:block;color:var(--lab);margin-bottom:4px}
label i{color:var(--red);font-style:normal}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:2px;padding:7px 12px;height:38px}
textarea{height:108px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(91,111,224,.45);outline-offset:0;border-color:var(--blue)}
.calc{background:#e9ecef;color:#aab2bd;font-size:18px;font-weight:600;cursor:not-allowed}
input[readonly]{background:#f4f6fb;color:var(--lab);cursor:not-allowed}
small{display:block;color:var(--mute);font-size:12.5px;margin-top:3px}
small svg{width:10px;height:10px;vertical-align:-1px}
.pick{display:flex;align-items:center;gap:8px;min-height:38px}
.pick button{font:inherit;background:#efefef;border:1px solid #767676;border-radius:3px;padding:2px 8px;cursor:pointer;transition:.2s}
.pick button:disabled{opacity:.5;cursor:not-allowed;background:#e0e0e0}
.must{color:#d63b3b;font-weight:700;text-transform:uppercase;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:3px 6px 3px 3px;max-width:100%}
.chip img,.chip .pdf-icon{width:36px;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:24px}
.chip img{object-fit:cover}
.chip .pdf-icon{background:#fbe6e6;color:#d63b3b;font-size:18px}
.chip span{font-size:13px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;font-size:18px;line-height:1;color:var(--mute);cursor:pointer}
.bar{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:14px}
#msg{margin:0 auto 0 0;font-size:14px;color:var(--red);font-weight:600}
.reset{display:inline-flex;align-items:center;gap:6px;background:#e9ecef;color:#444;border:0;border-radius:3px;padding:9px 16px;font:inherit;cursor:pointer}
.reset svg,.send svg{width:14px;height:14px}
.send{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:0;border-radius:4px;padding:15px 36px;font:inherit;font-weight:700;cursor:pointer}
.send:disabled{opacity:.6;cursor:wait}
h2{font-size:17px;font-weight:600;margin:0 0 12px}
.verdict{border-radius:8px;padding:14px 16px;border:1px solid}
.verdict b{display:block;font-size:18px}
.verdict p{margin:3px 0 0;overflow-wrap:anywhere}
.s-real{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.s-pending{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.s-rejected{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.s-invalid{background:var(--inv-bg);color:var(--inv);border-color:var(--inv-border)}
.ph{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:12px}
.ph header{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px}
.ph header strong{overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.ph p{margin:0 0 8px;font-size:13.5px;overflow-wrap:anywhere}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:13.5px}
dt{color:var(--mute)}dd{margin:0;overflow-wrap:anywhere}
details{margin-top:14px}summary{cursor:pointer;font-weight:600}
details label{margin-top:10px}
.row{display:flex;gap:10px;align-items:center;margin-top:12px}
.row button{font:inherit;padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;white-space:nowrap}
pre{max-height:240px;overflow:auto;font-size:12px;background:#f4f6fb;padding:10px;border-radius:6px}
</style>
</head>
<body>
<div class="page">
<div class="card">
<div class="head">
